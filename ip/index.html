<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Twoje IP</title>
<link rel="shortcut icon" type="image/ico" href="../favicon32.png" />
<style>
  body {
    background-color: #fff;
    font-family: sans-serif;
    color: #656565;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  .title {
    font-size: 24px;
    margin-top: 100px;
  }
  .ip {
    font-size: 48px;
    color: #323232;
    display: block;
    margin: 40px 0 10px;
    height: 55px;
  }
  .dots {
    color: #656565;
  }
  button {
    font-family: sans-serif;
    font-size: 14px;
    color: #454545;
    background: #f2f2f2;
    border: 1px solid #767676;
    padding: 2px 7px;
    border-radius: 3px;
    cursor: pointer;
  }
  button:hover {
    background: #e5e5e5;
    border: 1px solid #4f4f4f;
  }
</style>
</head>
<body>
  <div class="title">
    <a href="" style="text-decoration:none; color:#656565; cursor:default;">
      Twoje IP to:
    </a>
  </div>
  <div id="ip" class="ip">
    <span id="dots" class="dots">...</span>
  </div>
  <br><br><br>
  <button onclick="location.reload()">Odśwież</button>

  <script>
    let dots = 0;
    const dotSpan = document.getElementById('dots');
    const interval = setInterval(() => {
      dots = (dots + 1) % 4;
      dotSpan.textContent = '.'.repeat(dots);
    }, 500);

    async function getIP() {
      try {
        const response = await fetch('https://icanhazip.com', {
          cache: 'no-store'
        });
        if (!response.ok) {
          throw new Error('Błąd odpowiedzi serwera');
        }
        const ip = await response.text();
        document.getElementById('ip').textContent = ip.trim();
      } catch (e) {
        document.getElementById('ip').textContent = 'Błąd pobierania IP';
      } finally {
        clearInterval(interval);
      }
    }

    getIP();
  </script>
</body>
</html>

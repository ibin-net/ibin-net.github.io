<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibin-Net</title>
    <link rel="shortcut icon" type="image/ico" href="favicon32.png" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; 
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .centered-text {
            color: #1e293b;
            font-size: 6.5rem;
            font-weight: 300;
            letter-spacing: 5px;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="centered-text">Ibin-Net</div>

</body>
</html>
